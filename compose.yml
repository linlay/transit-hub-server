services:
  transit-hub:
    image: transit-hub-server
    container_name: transit-hub-server
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${BUILD_GOPROXY:-}
    env_file:
      - .env
    environment:
      ADDR: ":8080"
      DB_PATH: ${DB_PATH:-/app/data/transit-hub.db}
      USAGE_DB_PATH: ${USAGE_DB_PATH:-/app/data/transit-hub-usage.db}
      TELEMETRY_DB_PATH: ${TELEMETRY_DB_PATH:-/app/data/transit-hub-telemetry.db}
      TELEMETRY_RETENTION: ${TELEMETRY_RETENTION:-720h}
      CONFIG_DIR: /app/configs
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    networks:
      - transit-hub-net
    restart: unless-stopped

networks:
  transit-hub-net:
    external: true
