name: babelark
protocol: openai
base_url: https://api.babelark.ai
default_pool: primary
headers: {}
endpoints:
  openai_chat_completions: /v1/chat/completions
  openai_responses: /v1/responses
  openai_embeddings: /v1/embeddings
  openai_image_generations: /v1/images/generations
models:
  - public: gpt-6-luna
    upstream: gpt-6-luna
    type: chat
    pool: primary
    display_name: gpt-6-luna
  - public: gpt-6-sol
    upstream: gpt-6-sol
    type: chat
    pool: primary
    display_name: gpt-6-sol
  - public: gpt-5_6-luna
    upstream: gpt-5.6-luna
    type: chat
    pool: primary
    display_name: gpt-5.6-luna
  - public: gpt-5_6-terra
    upstream: gpt-5.6-terra
    type: chat
    pool: primary
    display_name: gpt-5.6-terra
  - public: gemini-3_1-flash-lite-image
    upstream: gemini-3.1-flash-lite-image
    type: image-generation
    pool: primary
    display_name: gemini-3.1-flash-lite-image
    image:
      endpointPath: /v1/images/generations
  - public: gpt-image-2
    upstream: gpt-image-2-t
    type: image-generation
    pool: primary
    display_name: gpt-image-2
    image:
      endpointPath: /v1/images/generations
  - public: gpt-image-2_5-flare
    upstream: gpt-image-2.5-flare
    type: image-generation
    pool: primary
    display_name: GPT Image 2.5 Flare
    image:
      endpointPath: /v1/images/generations
  - public: gpt-image-2_5-sunburst
    upstream: gpt-image-2.5-sunburst
    type: image-generation
    pool: primary
    display_name: GPT Image 2.5 Sunburst
    image:
      endpointPath: /v1/images/generations
  - public: gemini-3_1-flash-image-preview
    upstream: gemini-3.1-flash-image-preview
    type: image-generation
    pool: primary
    image:
      endpointPath: /v1/images/generations
  - public: glm5_2
    upstream: GLM-5.2
    type: chat
    pool: primary
    display_name: GLM-5.2
  - public: qwen3_7-max
    upstream: qwen3.7-max
    type: chat
    pool: primary
    display_name: qwen3.7-max
  - public: kimi-k2_7-code
    upstream: Kimi-K2.7-Code
    type: chat
    pool: primary
    display_name: Kimi-K2.7-Code
  - public: text-embedding-v4
    upstream: text-embedding-v4
    type: embedding
    pool: primary
    owned_by: babelark
    display_name: Text Embedding v4
pools:
  - name: primary
    accounts:
      - name: babelark-main
        api_key_env: BABELARK_API_KEY
        weight: 1
